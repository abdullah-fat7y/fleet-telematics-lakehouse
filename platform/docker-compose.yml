# Local source-system stack: generator -> API -> PostgreSQL -> Debezium (CDC) -> Kafka -> bridge -> Fabric.
#
#   docker compose up -d --build            start everything
#   ./connect/register.sh                   register the CDC connector (once)
#   open http://localhost:8085              Kafka UI (topics, messages, consumer lag)
#
# Local development credentials only; nothing here is exposed outside this machine.
# The bridge reads EVENTSTREAM_V2_CONNECTION_STRING from ../generator/.env (git-ignored).

name: fleet-platform

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_local}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    ports: ["55432:5432"]          # 5432 is often taken by a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1      # single broker in KRaft mode (no ZooKeeper)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 72          # keep disk use bounded
      KAFKA_LOG_RETENTION_BYTES: 4294967296  # 4 GB per partition at most
    ports: ["9092:9092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: fleet-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports: ["8083:8083"]

  api:
    build: ./api
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://fleet:${POSTGRES_PASSWORD:-fleet_local}@postgres:5432/fleet
    ports: ["8000:8000"]

  bridge:
    build: ./bridge
    depends_on:
      kafka: {condition: service_healthy}
    env_file: [../generator/.env]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SOURCE_TOPIC: fleet.public.telemetry_live
    volumes: [./bridge/logs:/app/logs]
    restart: unless-stopped
    profiles: [cloud]              # started on purpose: docker compose --profile cloud up -d bridge

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: fleet-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports: ["8085:8080"]          # 8080 is often taken locally

volumes:
  pgdata:
  kafkadata:
